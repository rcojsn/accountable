<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C Pipeline</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/charts.js"></script>
</head>
<body>
<nav class="rail">
  <span class="mark">A</span>
  <a href="dashboard.html" title="Dashboard"><i data-lucide="layout-dashboard"></i></a>
  <a class="on" href="pipeline.html" title="Pipeline"><i data-lucide="kanban"></i></a>
  <a href="#" title="Deals"><i data-lucide="handshake"></i></a>
  <a href="#" title="Contacts"><i data-lucide="users"></i></a>
  <a href="#" title="Organizations"><i data-lucide="building-2"></i></a>
</nav>

<main>
  <div class="topbar">
    <div class="crumbs"><h1>Pipeline</h1><span class="d">Amounts in South African rand (ZAR)</span></div>
    <div class="tools">
      <div class="search"><i data-lucide="search"></i>Filter deals<kbd>/</kbd></div>
      <a class="btn" href="#"><i data-lucide="plus"></i>New deal</a>
    </div>
  </div>

  <section class="hero slim">
    <div class="k"><div class="l">Open deals</div><div class="v">18</div></div>
    <div class="k"><div class="l">Open pipeline</div><div class="v" id="open"></div></div>
    <div class="k"><div class="l">Expected revenue</div><div class="v" id="exp" style="color:var(--green)"></div></div>
    <div class="k alert"><div class="l">Late</div><div class="v">3</div></div>
    <div class="hint"><i data-lucide="move" style="width:16px;height:16px"></i>Drag a card to change its stage or its place</div>
  </section>

  <div class="board" id="board"></div>
</main>

<script>
  const { money, short, stage, initials, columnTotals } = MK;
  document.getElementById('open').textContent = money(MOCK.kpis.openValue);
  document.getElementById('exp').textContent = money(MOCK.kpis.expected);

  const card = (d, s, extra = '') => `
    <div class="card ${d.late ? 'late' : ''} ${extra}">
      <div class="nm"><span>${d.name}</span>${d.late ? '<span class="late-badge">Late</span>' : ''}</div>
      <div class="org">${d.org}</div>
      <div class="val"><span>${money(d.value)}</span><span class="cd ${d.late ? "late" : ""}">${d.close}</span></div>
      <div class="pr"><div class="prob"><span style="width:${s.prob}%;background:${s.key === "won" ? "#06D6A0" : s.fill}"></span></div><small>${s.prob}%</small></div>
      <div class="ft"><span class="av">${initials(d.contact)}</span><span class="who">${d.contact}</span></div>
    </div>`;

  document.getElementById('board').innerHTML = MOCK.stages.map(s => {
    const t = columnTotals(s.key);
    const closed = s.key === 'won' || s.key === 'lost';
    const bg = s.key === 'negotiation' ? s.badge : s.fill;
    const cards = t.deals.map(d => card(d, s)).join('');
    return `<section class="col">
      <div class="colh" style="background:${bg};color:${s.on}">
        <div class="top"><span class="name">${s.name}</span><span class="cnt">${t.count}</span>
          <button class="add" title="Add deal" style="color:${s.on}"><i data-lucide="plus"></i></button></div>
        <div class="figs"><b>${short(t.value)}</b>${closed ? '' : `<span>exp. ${short(t.expected)}</span>`}</div>
        ${closed ? '<div class="window">Last 30 days</div>' : ''}
      </div>
      ${cards}
      <div class="addrow"><i data-lucide="plus"></i>Add deal</div>
    </section>`;
  }).join('');

  lucide.createIcons();
</script>
</body>
</html>
